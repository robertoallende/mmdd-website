name: Deploy MMDD Astro Website

# Manual deployment trigger - accessible via "Run workflow" button in GitHub UI
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Astro website
      run: npm run build
      
    - name: Download MMDD files
      run: |
        echo "📥 Downloading 00_mmdd.md from main MMDD repository..."
        curl -o dist/00_mmdd.md https://raw.githubusercontent.com/robertoallende/micromanaged-driven-development/refs/heads/main/dev_log/00_mmdd.md
        
        # Verify file was downloaded successfully
        if [ -f "dist/00_mmdd.md" ] && [ -s "dist/00_mmdd.md" ]; then
          echo "✅ 00_mmdd.md downloaded successfully"
          echo "📄 File size: $(wc -c < dist/00_mmdd.md) bytes"
        else
          echo "❌ Error: Failed to download 00_mmdd.md or file is empty"
          exit 1
        fi
        
        echo "📥 Downloading 00_kanban.md from main MMDD repository..."
        curl -o dist/00_kanban.md https://raw.githubusercontent.com/robertoallende/micromanaged-driven-development/refs/heads/main/dev_log/00_kanban.md
        
        # Verify file was downloaded successfully
        if [ -f "dist/00_kanban.md" ] && [ -s "dist/00_kanban.md" ]; then
          echo "✅ 00_kanban.md downloaded successfully"
          echo "📄 File size: $(wc -c < dist/00_kanban.md) bytes"
        else
          echo "❌ Error: Failed to download 00_kanban.md or file is empty"
          exit 1
        fi
        
        echo "📥 Downloading mmdd_init.sh from main MMDD repository..."
        curl -o dist/mmdd_init.sh https://raw.githubusercontent.com/robertoallende/micromanaged-driven-development/refs/heads/main/mmdd_init.sh
        
        # Verify file was downloaded successfully
        if [ -f "dist/mmdd_init.sh" ] && [ -s "dist/mmdd_init.sh" ]; then
          echo "✅ mmdd_init.sh downloaded successfully"
          echo "📄 File size: $(wc -c < dist/mmdd_init.sh) bytes"
        else
          echo "❌ Error: Failed to download mmdd_init.sh or file is empty"
          exit 1
        fi
      
    - name: Validate Astro build output
      run: |
        echo "Validating Astro build output..."
        
        # Check if dist directory exists
        if [ ! -d "dist" ]; then
          echo "❌ Error: dist/ directory not found"
          exit 1
        fi
        
        # Check if index.html exists
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Error: dist/index.html not found"
          exit 1
        fi
        
        # Check if HTML contains MMDD content
        if ! grep -q "Micromanaged Driven Development" dist/index.html; then
          echo "❌ Error: MMDD content not found in built HTML"
          exit 1
        fi
        
        # Check if RSS feed exists
        if [ ! -f "dist/rss.xml" ]; then
          echo "❌ Error: RSS feed not found at dist/rss.xml"
          exit 1
        fi
        
        # Check if sitemap exists
        if [ ! -f "dist/sitemap-index.xml" ]; then
          echo "❌ Error: Sitemap not found at dist/sitemap-index.xml"
          exit 1
        fi
        
        # Check if favicon exists
        if [ ! -f "dist/favicon.svg" ]; then
          echo "❌ Error: Favicon not found at dist/favicon.svg"
          exit 1
        fi
        
        # Check if MMDD guide file exists and is accessible
        if [ ! -f "dist/00_mmdd.md" ]; then
          echo "❌ Error: 00_mmdd.md not found in build output"
          exit 1
        fi
        
        # Check if MMDD kanban extension exists and is accessible
        if [ ! -f "dist/00_kanban.md" ]; then
          echo "❌ Error: 00_kanban.md not found in build output"
          exit 1
        fi
        
        # Check if MMDD init script exists and is accessible
        if [ ! -f "dist/mmdd_init.sh" ]; then
          echo "❌ Error: mmdd_init.sh not found in build output"
          exit 1
        fi
        
        # Check if pagefind index exists
        if [ ! -d "dist/pagefind" ]; then
          echo "❌ Error: Pagefind search index not found"
          exit 1
        fi
        
        echo "✅ Astro build validation passed"
        echo "📁 Built files:"
        find dist -maxdepth 2 -type f | sort
        
    - name: Add CNAME file for custom domain
      run: |
        echo "mmdd.dev" > dist/CNAME
        echo "✅ CNAME file created with mmdd.dev"
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: mmdd.dev
        
    - name: Deployment summary
      run: |
        echo "🚀 Astro deployment completed successfully!"
        echo "📍 Site will be available at: https://mmdd.dev"
        echo "⏰ DNS propagation may take a few minutes"
        echo "🔧 Built with Astro $(npm list astro --depth=0 2>/dev/null | grep astro || echo 'version unknown')"
